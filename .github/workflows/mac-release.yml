name: mac-release

# Build the macOS app for this fork (with the quake/dropdown terminal) and
# publish it to our own Homebrew tap (giggs-lynx/homebrew-tap).
#
# Trigger by pushing a tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Requirements (one-time, done in the GitHub UI):
#   * Enable Actions on this fork (Settings -> Actions).
#   * Add a secret HOMEBREW_TAP_TOKEN: a PAT with contents:write on
#     giggs-lynx/homebrew-tap (used to push the updated Cask). GITHUB_TOKEN
#     cannot push to a different repo, hence the PAT.
#
# The app is NOT code-signed or notarized (no Apple secrets), so Gatekeeper
# blocks first launch; the Cask caveats explain how to allow it.

on:
  push:
    tags:
      - "v*"
      - "mine-*"
  workflow_dispatch:

jobs:
  build:
    runs-on: "macos-latest"
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      MACOSX_DEPLOYMENT_TARGET: "10.12"
    steps:
      - name: "checkout repo"
        uses: actions/checkout@v5
        with:
          submodules: "recursive"
      - name: "Install Rust targets"
        shell: bash
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin
      - name: "Compile with sccache"
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: "Install System Deps"
        shell: bash
        run: "env CI=yes PATH=$PATH ./get-deps"
      - name: "Build (Intel)"
        shell: bash
        run: |
          cargo build --target x86_64-apple-darwin -p wezterm --release
          cargo build --target x86_64-apple-darwin -p wezterm-gui --release
          cargo build --target x86_64-apple-darwin -p wezterm-mux-server --release
          cargo build --target x86_64-apple-darwin -p strip-ansi-escapes --release
      - name: "Build (ARM)"
        shell: bash
        run: |
          cargo build --target aarch64-apple-darwin -p wezterm --release
          cargo build --target aarch64-apple-darwin -p wezterm-gui --release
          cargo build --target aarch64-apple-darwin -p wezterm-mux-server --release
          cargo build --target aarch64-apple-darwin -p strip-ansi-escapes --release
      - name: "Package (universal, unsigned)"
        env:
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: "bash ci/deploy.sh"
      - name: "Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "macos"
          path: "WezTerm-*.zip"

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: "checkout repo"
        uses: actions/checkout@v5
      - name: "Download artifact"
        uses: actions/download-artifact@v4
        with:
          name: "macos"
      - name: "Create/refresh GitHub release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          for f in WezTerm-*.zip; do sha256sum "$f" > "$f.sha256"; done
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "Automated build of the giggs-lynx/wezterm quake fork. Unsigned; see the Homebrew cask caveats to allow first launch." \
            || echo "release already exists"
          gh release upload "$TAG" WezTerm-*.zip *.sha256 --repo "$GITHUB_REPOSITORY" --clobber
      - name: "Update Homebrew tap cask"
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN secret is not set; skipping tap update." >&2
            exit 1
          fi
          ZIP="WezTerm-macos-${TAG}.zip"
          SHA=$(sha256sum "$ZIP" | cut -d' ' -f1)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/giggs-lynx/homebrew-tap.git" tap
          mkdir -p tap/Casks
          sed -e "s/@TAG@/${TAG}/g" -e "s/@SHA256@/${SHA}/g" \
            ci/homebrew-tap-cask.rb.template > tap/Casks/wezterm.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/wezterm.rb
          git commit -m "wezterm ${TAG}" || { echo "no changes"; exit 0; }
          git push
